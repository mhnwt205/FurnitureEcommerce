name: Backend Quality Gate

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'

jobs:
  backend-quality:
    runs-on: ubuntu-latest
   services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${{ secrets.CI_SQLSERVER_SA_PASSWORD }}
    ports:
      - 1433:1433
    options: >-
      --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 20
      --health-start-period 30s
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: ${{ secrets.CI_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npx prisma validate
      - run: npm audit --audit-level=high
